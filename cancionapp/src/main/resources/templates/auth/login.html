<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
</head>
<body>
<h1>Iniciar Sesión</h1>

<p th:if="${param.error}" style="color:red">Usuario o clave incorrectos.</p>
<p th:if="${param.logout}" style="color:green">Sesión cerrada correctamente.</p>
<p th:if="${param.registrado}" style="color:green">Registro exitoso, ya puedes iniciar sesión.</p>

<form method="post" th:action="@{/login}">
    <label>Usuario:</label>
    <input type="text" name="username" required /><br>
    <label>Clave:</label>
    <input type="password" name="password" required /><br>
    <button type="submit">Entrar</button>
</form>

<p><a th:href="@{/registro}">Crear una cuenta nueva</a></p>
<p><a th:href="@{/recuperar-clave}">¿Olvidaste tu clave?</a></p>
</body>
</html>
