<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Usuarios</title>
</head>
<body>
<form th:action="@{/logout}" method="post">
    <button type="submit">Cerrar sesión</button>
</form>
<h1>Usuarios</h1>
<a th:href="@{/usuarios/nuevo}">Agregar nuevo usuario</a>
<table border="1">
    <tr>
        <th>Nombre</th>
        <th>Rol</th>
        <th>Email</th>
        <th>Acciones</th>
    </tr>
    <tr th:each="usuario : ${usuarios}">
        <td th:text="${usuario.nombre}"></td>
        <td th:text="${usuario.rol}"></td>
        <td th:text="${usuario.email}"></td>
        <td>
            <a th:href="@{/usuarios/{id}(id=${usuario.id})}">Ver</a> |
            <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a> |
            <a th:href="@{/usuarios/{id}/eliminar(id=${usuario.id})}">Eliminar</a>
        </td>
    </tr>
</table>
<a th:href="@{/canciones}">Ir a Canciones</a>
</body>
</html>
